<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    
    <!-- Cargamos Font Awesome por si quiero ponerle íconos al formulario -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>

    <!-- Encabezado para identificar esta sección -->
    <h2>Formularios con Radiobotón</h2>

    <form action="" method="post">
        
        <!-- Pido el nombre del usuario normalmente -->
        Ingresa tu nombre:
        <input type="text" name="nombre">

        <br>
        <!-- Pregunta para seleccionar el nivel de estudios -->
        Selecciona el máximo de estudios que tienes:
        <br>

        <!-- 
          Uso type="radio" para opciones exclusivas (solo puede elegir una).
          Clave: Todos deben llevar el mismo name="estudios" para que se agrupen y desmarquen entre sí.
          El atributo 'value' es lo que realmente se manda al servidor cuando eligen una opción.
        -->
        <input type="radio" name="estudios" value="1"> Sin estudios <br>
        <input type="radio" name="estudios" value="2"> Primaria <br>
        <input type="radio" name="estudios" value="3"> Secundaria <br>
        <input type="radio" name="estudios" value="4"> Preparatoria <br>

        <!-- Botones para procesar o reiniciar el formulario -->
        <input type="submit" value="Enviar">
        <input type="reset" value="Borrar">

    </form>

</body>
</html>
