<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    
    <!-- Importo Font Awesome para los íconos de los botones de envío y borrado -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>

    <!-- Título para señalar la práctica de organización y bloques en formularios -->
    <h2>Formularios con agrupamiento</h2>

    <form action="" method="post">

        <!-- 
          Uso <fieldset> para crear un recuadro/caja que agrupa campos relacionados.
          Con <legend> le pongo el título a esa caja para ordenarlo visualmente.
        -->
        <fieldset>
            <legend>Datos personales</legend>

            Nombre y apellido:
            <input type="text" name="nombre_apellido"><br>

            Documento válido:
            <input type="file" name="documento"><br>

            <!-- Entrada especial type="date" para que abra un calendario selector -->
            Fecha de nacimiento:
            <input type="date" name="fecha_nacimiento">
        </fieldset>

        <!-- Segundo grupo de campos separados para la parte académica -->
        <fieldset>
            <legend>Datos de estudio:</legend>

            Nombre de la escuela:
            <input type="text" name="escuela"><br>

            Certificado válido:
            <input type="file" name="certificado"><br>

            Fecha de egreso:
            <input type="date" name="fecha_egreso">
        </fieldset>

        <br>

        <!-- Botones de acción con íconos -->
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>

    </form>

</body>
</html>
