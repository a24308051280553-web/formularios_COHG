<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    
    <!-- Librería de Font Awesome por si quiero añadir íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>

    <!-- Título para señalar la práctica de restricciones en campos -->
    <h2>Formulario con limitaciones</h2>

    <form action="" method="post">

        <!-- 
          Deshabilitación: Con 'disabled', el campo queda bloqueado (gris) 
          y el usuario no puede escribir ni seleccionar nada. Tampoco se envía su valor.
        -->
        Ingresa tu nombre:
        <input type="text" name="nombre" disabled><br>

        <!-- 
          Limitación de caracteres: Con 'maxlength="5"', la caja no me deja escribir 
          más de 5 letras o números. Ideal para PINs, códigos o contraseñas cortas.
        -->
        Contraseña:
        <input type="password" name="pass" maxlength="5"><br>

        <!-- 
          Solo lectura: Con 'readonly', el usuario puede ver y seleccionar el texto, 
          pero no puede editarlo ni borrarlo. A diferencia de 'disabled', este valor SÍ se envía al servidor.
        -->
        Comentarios:
        <textarea name="comentarios" readonly>
Este es mi comentario y no se puede borrar
        </textarea><br>

    </form>

</body>
</html>
