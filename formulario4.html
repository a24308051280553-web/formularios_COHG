<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    
    <!-- Librería de Font Awesome por si quiero usar íconos después -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>

    <!-- Título para señalar que este ejemplo es con casillas de selección -->
    <h2>Formularios con checkbox</h2>

    <form action="" method="post">
        
        <!-- Pido el nombre del usuario normalmente -->
        Ingresa tu nombre:
        <input type="text" name="nombre">

        <br>
        <!-- Indicación para la sección de tecnologías -->
        Selecciona los lenguajes que conozcas:
        <br>

        <!-- 
          Uso type="checkbox" para opciones múltiples:
          A diferencia de los radio buttons, aquí el usuario puede marcar varias casillas a la vez.
        -->
        <input type="checkbox" name="Java"> Java <br>
        <input type="checkbox" name="Python"> Python <br>
        <input type="checkbox" name="C#"> C# <br>
        <input type="checkbox" name="Flutter"> Flutter <br>

    </form>

</body>
</html>
