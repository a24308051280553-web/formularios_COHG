<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    
    <!-- Para jalar los íconos de Font Awesome si los llego a usar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <h2>Formulario con text area</h2>
    <form action="" method="post">
        
        <!-- Pido el nombre con un input de texto normal -->
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>

        <!-- Pido el correo usando type="email" para que valide el @ automáticamente -->
        Ingresa tu correo:
        <input type="email" name="correo">
        <br>

        <!-- Pido los comentarios con textarea porque permite escribir varias líneas -->
        Ingresa tus comentarios:
        <textarea name="comentarios" rows="1" cols="10"></textarea>
        <br>

        <!-- Botones para mandar la información o limpiar todo el formulario -->
        <input type="submit" value="Enviar">
        <input type="reset" value="Borrar">

    </form>

</body>
</html>
